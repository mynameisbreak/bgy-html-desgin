<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Bad Theme Drift</title>
  <style>
    body {
      margin: 0;
      width: 1280px;
      height: 720px;
      font-family: DIN, Arial, sans-serif;
      background: #ffffff;
    }
    .slide {
      width: 1280px;
      height: 720px;
      color: #ff00ff;
    }
    .card {
      position: absolute;
      left: 80px;
      top: 140px;
      width: 320px;
      height: 120px;
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.22);
      background: #fff7cc;
    }
  </style>
</head>
<body>
  <section class="slide" data-slide>
    <div class="card">
      <p>这页故意偏离项目主题，用于验证 preflight。</p>
    </div>
  </section>
</body>
</html>
